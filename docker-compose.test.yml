services:
  postgres-test:
    image: postgres:16-alpine
    container_name: urbanfleet-postgres-test
    environment:
      POSTGRES_DB: urbanfleet_test
      POSTGRES_USER: urbanfleet
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urbanfleet -d urbanfleet_test"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis-test:
    image: redis:7-alpine
    container_name: urbanfleet-redis-test
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5
