name: CI

on:
  push:
    branches: [main, master]

  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      REDIS_URL: redis://127.0.0.1:6379/15
      MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
      MONGODB_DB_NAME: UrbanFleet

      JWT_ACCESS_SECRET: ci-test-access-secret
      JWT_REFRESH_SECRET: ci-test-refresh-secret

      RAZORPAY_KEY_ID: test_key
      RAZORPAY_KEY_SECRET: test_secret

      FRONTEND_URL: https://urbanfleet-project.vercel.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Start MongoDB replica set
        shell: bash
        run: |
          set -e

          docker run -d \
            --name urbanfleet-mongo \
            -p 27017:27017 \
            mongo:8 \
            mongod --replSet rs0 --bind_ip_all

          echo "Waiting for MongoDB..."

          for i in {1..30}; do
            if docker exec urbanfleet-mongo \
              mongosh --quiet \
              --eval "db.adminCommand('ping').ok" 2>/dev/null | grep -q "1"; then
              echo "MongoDB is ready"
              break
            fi

            if [ "$i" -eq 30 ]; then
              echo "MongoDB failed to become ready"
              docker logs urbanfleet-mongo
              exit 1
            fi

            sleep 2
          done

          echo "Initializing MongoDB replica set..."

          docker exec urbanfleet-mongo \
            mongosh --quiet --eval \
            'try {
              rs.status();
              print("Replica set already initialized");
            } catch (e) {
              rs.initiate({
                _id: "rs0",
                members: [
                  { _id: 0, host: "127.0.0.1:27017" }
                ]
              });
            }'

          echo "Waiting for MongoDB replica set..."

          for i in {1..30}; do
            if docker exec urbanfleet-mongo \
              mongosh --quiet \
              --eval "rs.status().ok" 2>/dev/null | grep -q "1"; then
              echo "MongoDB replica set is ready"
              break
            fi

            if [ "$i" -eq 30 ]; then
              echo "MongoDB replica set failed to become ready"
              docker logs urbanfleet-mongo
              exit 1
            fi

            sleep 2
          done

          echo "MongoDB container:"
          docker ps --filter "name=urbanfleet-mongo"

      - name: Lint backend
        run: npm run lint

      - name: Typecheck backend
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit

      - name: Run API tests
        run: npm run test:api

      - name: Run WebSocket tests
        run: npm run test:websocket

      - name: Run integration tests
        run: npm run test:integration
        env:
          RUN_INTEGRATION: "1"

      - name: Build backend
        run: npm run build

      - name: Build backend Docker image
        run: docker build -t urbanfleet-backend:ci .

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Dump MongoDB logs on failure
        if: failure()
        run: docker logs urbanfleet-mongo || true

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: https://urbanfleet-fj9c.onrender.com
          VITE_GOOGLE_CLIENT_ID: 841434396195-7l7q5r78htpukv1v8muvo1jko4pm939j.apps.googleusercontent.com